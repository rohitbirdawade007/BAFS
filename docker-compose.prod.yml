# ============================================================
# BIRDAWADE ASSOCIATES & FINANCIAL SERVICES (BAFS)
# Production Docker Compose Configuration
# ============================================================
name: bafs-production

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database (16-Alpine)
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bafs_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bafs_db}
      POSTGRES_USER: ${POSTGRES_USER:-bafs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - bafs_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bafs_user} -d ${POSTGRES_DB:-bafs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Redis Cache & Job Queue (7-Alpine)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bafs_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - bafs_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # MinIO Document Storage (S3-compatible)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: bafs_prod_minio
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in production}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in production}
    volumes:
      - minio_prod_data:/data
    networks:
      - bafs_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # Database Migration Runner (Alembic)
  # Runs 'alembic upgrade head' on deployment
  # ─────────────────────────────────────────────
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bafs_prod_migration
    restart: "no"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bafs_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bafs_db}
    command: alembic upgrade head
    networks:
      - bafs_internal
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # FastAPI Backend (Production Multi-worker)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bafs_prod_backend
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bafs_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bafs_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    expose:
      - "8000"
    networks:
      - bafs_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ─────────────────────────────────────────────
  # ARQ Asynchronous Job Worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bafs_prod_worker
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bafs_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bafs_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    command: arq app.workers.main.WorkerSettings
    networks:
      - bafs_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────
  # Next.js Frontend (Production Standalone)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: bafs_prod_frontend
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: /api/v1
    expose:
      - "3000"
    networks:
      - bafs_internal
    depends_on:
      backend:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy (SSL & Load Balancer)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: bafs_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl:/etc/nginx/ssl:ro
    networks:
      - bafs_internal
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

# ─────────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────────
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  minio_prod_data:
    driver: local
  nginx_ssl:
    driver: local

networks:
  bafs_internal:
    driver: bridge
