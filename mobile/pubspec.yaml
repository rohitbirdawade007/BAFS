name: bafs_mobile
description: "BAFS Loan Consultancy & DSA Platform - Customer & Consultant Experiences"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing & Deep Linking
  go_router: ^14.1.4

  # Networking & HTTP Client
  dio: ^5.4.3+1

  # Secure Local Storage (for JWT tokens)
  flutter_secure_storage: ^9.2.2

  # General Shared Preferences (for non-sensitive preferences)
  shared_preferences: ^2.2.3

  # Formatting & Date manipulation
  intl: ^0.19.0

  # File Selection (for document uploads)
  file_picker: ^8.0.3

  # Icons & Graphics
  flutter_svg: ^2.0.10+1

  # JSON Annotation
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
