# ============================================================
# Render.com Blueprint for BAFS Backend (Free Tier)
# ============================================================
services:
  - type: web
    name: bafs-backend-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CARGO_HOME
        value: "/tmp/cargo"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Birdawade Associates & Financial Services"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BACKEND
        value: "minio"
      - key: MINIO_ENDPOINT
        value: "localhost:9000"
      - key: SMS_PROVIDER
        value: "mock"
